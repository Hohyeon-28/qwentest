experiment:
  name: qwen3_8b_int4_cot_39k_v2
  seed: 20250724
  # Keep the original 4K run and any earlier 39K partial run intact.
  output_dir: results_39k_v2

models:
  # BF16 baseline only.
  base: Qwen/Qwen3-8B
  # Both Fake and Real MUST use this exact standard GPTQ/GPTQ-v2 checkpoint.
  real_gptq: JunHowie/Qwen3-8B-GPTQ-Int4
  trust_remote_code: false
  revision: main

quantization:
  shared:
    source: models.real_gptq
    tuple: [qweight, scales, qzeros, g_idx]
    bits: 4
    group_size: 128
    fingerprint: sha256
  fake:
    method: dequantize_shared_gptq
    bits: 4
    group_size: 128
    symmetric: true
    desc_act: false
    compute_dtype: bfloat16
    execution: torch_linear
    source: models.real_gptq
  real:
    method: gptq
    bits: 4
    group_size: 128
    symmetric: true
    desc_act: false
    backend: gptq_marlin
    # Qwen3's default 40,960-token allocation accommodates the 38,912-token
    # complex-reasoning output budget plus the observed <=799-token prompts.
    max_model_len: 40960
    enable_chunked_prefill: false
    # Disable CUDA graph/TorchDynamo capture on the legacy CUDA 11.8 stack.
    # GPTQ-Marlin remains the selected weight kernel.
    enforce_eager: true
    source: models.real_gptq

generation:
  enable_thinking: true
  # Qwen recommends 38,912 output tokens for complex math/code benchmarks.
  max_new_tokens: 38912
  deterministic: true
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  seed: 20250724
  batch_size: 1
  # Qwen3's published generation config uses both <|im_end|> and
  # <|endoftext|>. The exact same ordered set is passed to HF and vLLM.
  stop_token_ids: [151645, 151643]

datasets:
  gsm8k:
    path: openai/gsm8k
    name: main
    split: test
    max_samples: null
  math500:
    path: HuggingFaceH4/MATH-500
    name: null
    split: test
    max_samples: null
  humaneval:
    path: openai/openai_humaneval
    name: null
    split: test
    max_samples: null
    evaluator: openai_human_eval
  mbpp:
    path: google-research-datasets/mbpp
    name: sanitized
    split: test
    max_samples: null
    evaluator: mbpp_tests
  livecodebench:
    path: livecodebench/code_generation_lite
    name: null
    split: test
    max_samples: null
    evaluator: livecodebench
    # Pin a release. "release_latest" is unsuitable for a reproducible study.
    version_tag: release_v6
    trust_remote_code: true

throughput_benchmark:
  # This is separate from the batch_size=1 quality/CoT protocol above.
  batch_sizes: [1, 2, 4, 8, 16]
  max_num_seqs: 16
  max_samples: 64
  max_new_tokens: 512

evaluation:
  # Fixed bins remain useful for absolute-length reporting. Balanced BF16
  # quantile bins are generated separately for the primary trend analysis.
  length_buckets: [0, 513, 1025, 2049, 4097, 8193, 12289, 16385, 24577, 32769]
  length_quantile_bins: 5
  primary_length_outcome: fake_real_answer_disagreement
  permutation_trials: 10000
  # Abort comparison/plot generation if more than 1% of any condition reaches
  # the output cap without closing </think>.
  max_reasoning_censored_fraction: 0.01
  # Also reject traces that terminate by EOS without ever closing </think>.
  max_reasoning_incomplete_fraction: 0.01
  warmup_samples: 2
  logit_subset_size: 20
  logit_top_k: 20
  # Mechanism analysis uses all observed Fake/Real correctness flips and an
  # equal number of deterministic length/divergence-matched non-flip controls.
  first_divergence_repeats: 2
